name: Scorecard

# OpenSSF Scorecard grades this repository's supply-chain posture against
# checks that live outside the codebase: whether actions are SHA-pinned,
# whether branch protection is on, whether dangerous workflow triggers are
# used, whether Dependabot is configured. CI proves the code builds; this
# reports on everything around the code that CI cannot see.
#
# Findings land in the Security tab as code scanning alerts.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly. Scorecard's grade moves when repository settings change or when
    # new checks ship upstream, neither of which produces a commit — so a
    # push-only trigger would let the grade silently go stale. Offset off the
    # hour; scheduled jobs at :00 queue behind everyone else's.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: analyze supply-chain posture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Upload results to the Security tab.
      security-events: write
      # Read the workflow run list, which the Dangerous-Workflow and
      # Token-Permissions checks inspect.
      actions: read
      contents: read
      # Publish the result to the public OpenSSF API via a signed OIDC token,
      # with no repository secret involved. Required by publish_results below.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the grade to the public OpenSSF dataset. This repo is
          # already public, and the checks only ever read public metadata, so
          # there is nothing disclosed here that is not already visible.
          publish_results: true

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
