name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately `pull_request`, never `pull_request_target`. The latter runs
    # untrusted fork code with a write-scoped token and repo secrets in scope,
    # which is the single most exploited misconfiguration in public repos.
    branches: [main]

# Least privilege. The default token grants more than any job here needs, and
# a compromised dependency inherits whatever the token can do.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so a rapid push sequence does not
# leave stale checks reporting against outdated commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # All actions are pinned to a full commit SHA rather than a tag. Tags are
      # mutable: an attacker who compromises an action repo can repoint v4 at
      # malicious code and every consumer picks it up silently.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the credential in .git/config where any later step or
          # transitive build script could read it.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # Fails if package.json and bun.lock disagree, so a PR cannot resolve to
      # dependency versions that differ from the reviewed lockfile.
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs independently of the build so a newly published advisory is
    # attributable on its own rather than buried in a failed build job.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Fails only on high/critical advisories absent from .audit-baseline.json.
      # A raw `bun audit` gate would be permanently red — several highs are
      # pinned transitively by eslint and next with no version in range — and a
      # permanently red gate stops being read. See scripts/audit-drift.ts.
      - name: Audit (drift)
        run: bun run audit
