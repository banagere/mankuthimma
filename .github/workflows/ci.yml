name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately `pull_request`, never `pull_request_target`. The latter runs
    # untrusted fork code with a write-scoped token and repo secrets in scope,
    # which is the single most exploited misconfiguration in public repos.
    branches: [main]

# Least privilege. The default token grants more than any job here needs, and
# a compromised dependency inherits whatever the token can do.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so a rapid push sequence does not
# leave stale checks reporting against outdated commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # All actions are pinned to a full commit SHA rather than a tag. Tags are
      # mutable: an attacker who compromises an action repo can repoint v4 at
      # malicious code and every consumer picks it up silently.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the credential in .git/config where any later step or
          # transitive build script could read it.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Read from .bun-version so CI, the local gate and every clone agree
          # on one number in one place. A hardcoded version here drifts the
          # moment someone upgrades locally.
          bun-version-file: .bun-version

      # Fails if package.json and bun.lock disagree, so a PR cannot resolve to
      # dependency versions that differ from the reviewed lockfile.
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs independently of the build so a newly published advisory is
    # attributable on its own rather than buried in a failed build job.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Read from .bun-version so CI, the local gate and every clone agree
          # on one number in one place. A hardcoded version here drifts the
          # moment someone upgrades locally.
          bun-version-file: .bun-version

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Fails only on high/critical advisories absent from .audit-baseline.json.
      # A raw `bun audit` gate would be permanently red — several highs are
      # pinned transitively by eslint and next with no version in range — and a
      # permanently red gate stops being read. See scripts/audit-drift.ts.
      - name: Audit (drift)
        run: bun run audit

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The .githooks pre-commit scan is opt-in per clone (core.hooksPath) and
    # bypassable with --no-verify. This job is neither. It is the only secret
    # scan in the pipeline that a committer cannot skip, which on a public repo
    # holding a Vercel KV connection string is the one that matters.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history. A secret that was committed and then "removed" in a
          # later commit is still in the objects and still published; scanning
          # only the tip would report clean on exactly that case.
          fetch-depth: 0

      # Installed from the pinned release tarball and checksum-verified rather
      # than via gitleaks-action. One less third-party action with access to the
      # workflow, and the thing actually executed is verified by digest instead
      # of by trusting a tag or a marketplace publisher.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks git --no-banner --redact --exit-code 1

  signatures:
    name: commit signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Branch protection already requires signed commits on main, so this is
    # belt and braces. What it adds is legibility: an unsigned commit fails here
    # as a named red check on the pull request, rather than as a merge that is
    # silently refused at the end with no obvious reason why.

    steps:
      - name: Verify every new commit is signed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "$PR" ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/commits" > commits.json
          else
            gh api "repos/$REPO/commits/$SHA" | jq -s '.' > commits.json
          fi

          unsigned=$(jq -r '
            .[]
            | select(.commit.verification.verified | not)
            | "  \(.sha[0:8])  \(.commit.message | split("\n")[0])  [\(.commit.verification.reason)]"
          ' commits.json)

          if [ -n "$unsigned" ]; then
            echo "::error::Commits without a verified signature:"
            echo "$unsigned"
            exit 1
          fi

          echo "All $(jq length commits.json) commit(s) carry a verified signature."
